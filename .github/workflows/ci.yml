name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      # This suite imports the real OMP 18.2.8 host packages, which import Bun
      # globals and cannot run under the Node-based unit-test command.
      - name: OMP host compatibility
        run: bun test tests/omp-18-compat.test.mjs

      # Kept a separate step rather than folded into the unit glob: this is the
      # Zod cross-version compatibility boundary (SDK-bundled 4.4.3 walker vs a
      # newer host Zod), and it should stay visible by name in CI output. Runs
      # the committed 4.4.3 / 4.5.2 / 4.5.3 / 4.6.5 matrix from pinned
      # devDependency aliases, so it downloads nothing beyond `bun install`.
      - name: Cross-version Zod compatibility
        run: bun run test:crossversion
