name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Show Claude Agent SDK parity
        run: node -e 'const p=require("./node_modules/@anthropic-ai/claude-agent-sdk/package.json"); console.log(`claude-agent-sdk=${p.version} claudeCodeVersion=${p.claudeCodeVersion}`)'

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: bun.lock

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test
