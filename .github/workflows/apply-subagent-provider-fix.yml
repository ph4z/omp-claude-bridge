name: Apply subagent provider fix

on:
  push:
    branches:
      - fix/subagent-provider-registration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subagent-provider-registration

      - name: Patch src/index.ts
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/index.ts")
          source = path.read_text()

          old_import = 'import { rateLimitNotice } from "./rate-limit.js";\n'
          new_import = old_import + 'import { ACTIVE_STREAM_SIMPLE_KEY, registerSharedProvider } from "./provider-registration.js";\n'
          if new_import not in source:
              if old_import not in source:
                  raise SystemExit("rate-limit import anchor not found")
              source = source.replace(old_import, new_import, 1)

          old_key_block = '''// Global key to prevent re-registration of the provider across module reloads.
          //
          // Extensions like OMP subagents spawn a subagent and it loads this module
          // again. Without this guard, the subagent's call to registerProvider() would
          // overwrite the parent's `streamSimple` function reference in the shared
          // ModelRegistry. When the parent later delivers a tool result, it would call
          // the subagent's `streamSimple` (which has empty state) instead of its own.
          //
          // By storing the active streamSimple in a Symbol.for() global (shared across all
          // module instances), we ensure only the FIRST instance to register takes effect.
          // Subsequent instances wrap the stored function instead of overwriting it.
          //
          // On session_shutdown (including /reload), clearSession() resets this so a fresh
          // registration can occur for the next session.
          const ACTIVE_STREAM_SIMPLE_KEY = Symbol.for("claude-bridge:activeStreamSimple");
          '''
          new_key_block = '''// Provider callback sharing across parent/child sessions is handled by
          // registerSharedProvider() in provider-registration.ts. session_shutdown still
          // clears ACTIVE_STREAM_SIMPLE_KEY below so a fresh top-level session can own it.
          '''
          if old_key_block in source:
              source = source.replace(old_key_block, new_key_block, 1)
          elif 'const ACTIVE_STREAM_SIMPLE_KEY = Symbol.for("claude-bridge:activeStreamSimple");' in source:
              raise SystemExit("ACTIVE_STREAM_SIMPLE_KEY found with unexpected surrounding text")

          old_provider = '''\t// Guard against re-registration when the module is loaded multiple times
          \t// (e.g., when spawning subagents). The shared ModelRegistry would otherwise
          \t// overwrite the parent's streamSimple, breaking tool result delivery.
          \t// See ACTIVE_STREAM_SIMPLE_KEY for the full mechanism.

          \tconst g = globalThis as Record<symbol, any>;
          \tif (!g[ACTIVE_STREAM_SIMPLE_KEY]) {
          \t\t// First instance: store our streamSimple and register.
          \t\tg[ACTIVE_STREAM_SIMPLE_KEY] = streamClaudeAgentSdk;
          \t\tpi.registerProvider(PROVIDER_ID, {
          \t\t\tbaseUrl: "claude-bridge",
          \t\t\tapiKey: "not-used",
          \t\t\tapi: "claude-bridge",
          \t\t\tmodels: registeredModels,
          \t\t\t// Cast: pi-ai AssistantMessageEventStream diamond dep between pi-coding-agent and pi-agent-core
          \t\t\tstreamSimple: streamClaudeAgentSdk as any,
          \t\t});
          \t} else {
          \t\t// Subsequent instance (subagent session): skip registration entirely.
          \t\t// The subagent already has access to claude-bridge models via the shared
          \t\t// ModelRegistry from the parent's registration. Calls to those models
          \t\t// route through the parent's streamSimple via reentrant QueryContexts.
          \t\tdebug(`provider: skipping re-registration, parent instance active (module=${moduleInstanceId})`);
          \t}
          '''
          new_provider = '''\t// OMP child sessions share the parent's ModelRegistry, but OMP clears
          \t// extension-owned provider registrations before replaying registrations from
          \t// the child's extension runtime. Therefore every session must register the
          \t// provider, while every child must keep using the first (parent) streamSimple.
          \tconst { isFirstProviderInstance } = registerSharedProvider({
          \t\tproviderId: PROVIDER_ID,
          \t\tstreamSimple: streamClaudeAgentSdk,
          \t\tconfig: {
          \t\t\tbaseUrl: "claude-bridge",
          \t\t\tapiKey: "not-used",
          \t\t\tapi: "claude-bridge",
          \t\t\tmodels: registeredModels,
          \t\t},
          \t\t// Cast: pi-ai AssistantMessageEventStream diamond dep between pi-coding-agent and pi-agent-core
          \t\tregisterProvider: (providerId, config) => pi.registerProvider(providerId, config as any),
          \t});
          \tif (!isFirstProviderInstance) {
          \t\tdebug(`provider: re-registering with parent streamSimple (module=${moduleInstanceId})`);
          \t}
          '''
          if new_provider not in source:
              if old_provider not in source:
                  raise SystemExit("provider registration block not found")
              source = source.replace(old_provider, new_provider, 1)

          path.write_text(source)

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate
        run: |
          bun run typecheck
          bun run test

      - name: Commit patched index
        run: |
          if git diff --quiet -- src/index.ts; then
            echo "src/index.ts already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git commit -m "fix: re-register claude provider in child sessions"
          git push origin HEAD:fix/subagent-provider-registration
