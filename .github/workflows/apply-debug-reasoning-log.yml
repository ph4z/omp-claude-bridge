name: Apply reasoning debug instrumentation

on:
  push:
    branches:
      - chore/debug-reasoning-effort

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/debug-reasoning-effort
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Apply instrumentation
        run: python3 scripts/apply-debug-reasoning-log.py

      - name: Validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Commit final patch and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-debug-reasoning-log.yml
          rm scripts/apply-debug-reasoning-log.py
          git add -A
          git commit -m "chore: log reasoning effort mapping in debug mode"
          git push origin HEAD:chore/debug-reasoning-effort
