name: Apply dynamic model safety review fixes

on:
  push:
    branches:
      - feat/dynamic-model-discovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-model-discovery
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Apply review fixes
        run: python3 scripts/apply-dynamic-model-safety-review.py

      - name: Validate
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test

      - name: Commit fixes and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-dynamic-model-safety.yml
          rm scripts/apply-dynamic-model-safety-review.py
          git add src/models.ts src/index.ts tests/unit-model-discovery.mjs README.md CHANGELOG.md .github/workflows/patch-dynamic-model-safety.yml scripts/apply-dynamic-model-safety-review.py
          git commit -m "fix: preserve effort tiers and context safety"
          git push origin HEAD:feat/dynamic-model-discovery
